<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cool Portfolio</title>
    <style>
        /* --- CSS Reset & Global Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: #0f172a; /* สีน้ำเงินเข้ม/ดำ */
            color: #e2e8f0; /* สีตัวอักษรขาวเทา */
            overflow-x: hidden;
        }

        /* --- Navigation Bar --- */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 10%;
            z-index: 1000;
            border-bottom: 1px solid #1e293b;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #06b6d4; /* สีฟ้า Cyan */
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 2rem;
        }

        nav ul li a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 1rem;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #06b6d4;
        }

        /* --- Layout Sections --- */
        section {
            min-height: 100vh;
            padding: 8rem 10% 4rem 10%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .section-title {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            color: #f8fafc;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 50px;
            height: 4px;
            background-color: #06b6d4;
            margin-top: 0.5rem;
            border-radius: 2px;
        }

        /* --- 1. Home Section --- */
        #home {
            align-items: flex-start;
        }

        #home h1 {
            font-size: 4rem;
            color: #f8fafc;
            margin-bottom: 1rem;
        }

        #home h1 span {
            color: #06b6d4;
        }

        #home p {
            font-size: 1.5rem;
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            background-color: transparent;
            color: #06b6d4;
            border: 2px solid #06b6d4;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #06b6d4;
            color: #0f172a;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }

        /* --- 2. About Section --- */
        .about-content {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #94a3b8;
            max-width: 800px;
        }

        /* --- 3. Education Section (Timeline) --- */
        .timeline {
            border-left: 2px solid #1e293b;
            padding-left: 2rem;
            position: relative;
        }

        .timeline-item {
            margin-bottom: 2.5rem;
            position: relative;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: calc(-2rem - 6px);
            top: 5px;
            width: 10px;
            height: 10px;
            background-color: #06b6d4;
            border-radius: 50%;
        }

        .timeline-year {
            font-weight: bold;
            color: #06b6d4;
            margin-bottom: 0.5rem;
        }

        .timeline-title {
            font-size: 1.3rem;
            color: #f8fafc;
        }

        /* --- 4. Skills Section --- */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .skill-card {
            background-color: #1e293b;
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #334155;
            transition: transform 0.3s;
        }

        .skill-card:hover {
            transform: translateY(-5px);
            border-color: #06b6d4;
        }

        /* --- 5. Contact Section --- */
        .contact-container {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .contact-info {
            flex: 1;
            min-width: 250px;
        }

        .contact-info p {
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .contact-form {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .contact-form input, .contact-form textarea {
            width: 100%;
            padding: 1rem;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 5px;
            color: #f8fafc;
        }

        .contact-form input:focus, .contact-form textarea:focus {
            outline: none;
            border-color: #06b6d4;
        }

        .contact-form button {
            padding: 1rem;
            background-color: #06b6d4;
            color: #0f172a;
            border: none;
            border-radius: 5px;
